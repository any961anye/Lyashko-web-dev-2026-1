<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="style.css">
    <style>
     *{
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
    }
    .label {
    font-weight: 450;
    margin-right: 10px;
    font-size: 24px;
}
.block {
    margin-bottom:  10px;
}
.color {
    width: 100%;
    background-color: #840b27;
    color: white ;
    font-size: 18px;
    letter-spacing: 1px;   
    margin-top: 10px;
  
}
.login-page {
    background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSFFgqWPMLL6rTD8KG04NZ7FmuRXl4r0JUwCCRg2VO3OT4dBXtBq5-RB_c&s=10);
    background-size: cover;           
    background-position: center;      
    background-repeat: no-repeat; 
    background-attachment: fixed;    
    min-height: 100vh;                
    margin: 0;
    padding: 0;
    display: flex;                    
    justify-content: center;          
    align-items: center;              
}
.login-form {
    background-color: rgba(255, 255, 255, 0.95); 
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    width: 500px;
    max-width: 90%;
}
.login-form h1 {
    text-align: center;            
    margin-bottom: 15px;
    font-size: 32px;
    color: #1a1a1a;
}

.checkbox-label {
    display: flex;
    text-align: center;
    align-items: center;
    font-weight: 400;
    font-size: 14px;
    cursor: pointer;
}

</style>
</head>

<body>
    <header>
    <div class="container">
        <h1>BookPoint</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="login.html">Войти</a>
            <a href="order.html">Собрать заказ</a>
            <a href="feedback.html">Обратная связь</a>
            <a href="#footer">Контакты</a>
        </nav>
    </div>
</header>
    <main class="login-page">
    <div class="login-wrapper">
        <form action="https://httpbin.org/post" method="POST" class="login-form">
            <h1>Вход</h1>

            <div class="block">
                <label class="label" for="login">Логин</label>
                <input type="text" id="login" name="login" placeholder="Введите логин">
            </div>

            <div class="block">
                <label class="label" for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль">
            </div>

            <div class="block">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember" value="yes">
                    Запомнить меня
                </label>
            </div>

            <button type="submit" class="color">Войти</button>
        </form>
    </div>
    </main>

    <footer id="footer">
     <div class="container">
        <p>Позвонить нам: <a href="tel:+70000000000">+7-000-000-00-00</a></p>
     </div>
</footer>

</body>
</html>
